const sceneIcon=(scene)=>{const n=(scene.name||'').toLowerCase();let k=scene.iconType||'';if(!k){if(/美食|餐|饮|food|cook|咖啡/.test(n))k='food';else if(/科技|数码|电脑|tech|digital/.test(n))k='tech';else if(/工作|学习|课程|学校|work|study/.test(n))k='study';else if(/旅行|交通|出行|travel/.test(n))k='travel';else if(/购物|消费|shopping/.test(n))k='shop';else if(/运动|健身|sport/.test(n))k='sport';else if(/聊天|交流|社交|chat|talk/.test(n))k='chat';else k='folder'}const paths={chat:'<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M7.5 10.5h9M7.5 14h6"/>',food:'<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M18 21V3c-3.5 2-5 5-5 9h5"/>',tech:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',study:'<path d="M3 5.5C6 4 9 4 12 6v14c-3-2-6-2-9-.5V5.5ZM21 5.5c-3-1.5-6-1.5-9 .5v14c3-2 6-2 9-.5V5.5Z"/>',travel:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M5 10h14M9 17v2M15 17v2"/>',shop:'<path d="M4 9h16l-1.5 12h-13L4 9ZM8 10V7a4 4 0 0 1 8 0v3"/>',sport:'<circle cx="12" cy="12" r="9"/><path d="m8 5 4 4 5-1M12 9l-2 6-5 2M10 15l5 5"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/>'};return '<svg class="scene-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[k]||paths.folder)+'</svg>'};
const today=()=>new Date().toLocaleDateString('en-CA');const newId=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9));const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{const v=JSON.parse(localStorage.getItem(DBKEY));if(v&&Array.isArray(v.scenes)&&Array.isArray(v.items))return v}catch(e){}return{scenes:structuredClone(DEFAULT_SCENES),items:[],settings:{}}};let db=load();db.tags=Array.isArray(db.tags)?db.tags:[];db.outputHistory=Array.isArray(db.outputHistory)?db.outputHistory:[];db.items.forEach(i=>{if(!Array.isArray(i.tagIds))i.tagIds=[];if(typeof i.starred!=='boolean')i.starred=false});let scenePageId='',collectionMode='all',tagFilter='',outputScene='',outputQueue=[],outputIndex=0,outputRevealed=false,outputRecorder=null,outputStream=null,outputParts=[],outputURL=null,outputResults=[],speechRecognizer=null,speechListening=false,speechText='',speechStatus='尚未开始语音识别',speechError='',view='home',filterScene='',filterType='',search='',mode='new',study=[],studyIndex=0,showAnswer=false,sessionSummary=[],selectItems=[],toastTimer;

const uiIcon=(name)=>{const paths={home:'<path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-7h6v7"/>',library:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',favorites:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',study:'<path d="M3 5.5C6 4 9 4 12 6v14c-3-2-6-2-9-.5V5.5ZM21 5.5c-3-1.5-6-1.5-9 .5v14c3-2 6-2 9-.5V5.5Z"/>',output:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>',notes:'<path d="M4 3h16v18H4zM8 8h8M8 12h8M8 16h5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',mic:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>',sound:'<path d="M4 9v6h4l5 4V5L8 9H4ZM17 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/>',note:'<path d="M4 3h16v18H4zM8 8h8M8 12h8"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 17v4h16v-4"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>'};return '<svg class="ui-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.library)+'</svg>'};
const navHTML=(bottom=false)=>navs.map(([k,n])=>`<button class="${bottom?'':'nav '}${view===k?'active':''}" data-nav="${k}"><span class="nav-icon">${uiIcon(k)}</span><span>${n}</span></button>`).join('');

function setView(k){if(location.hash.startsWith('#scene-'))history.replaceState(null,'',location.pathname+location.search);scenePageId='';collectionMode='all';tagFilter='';if(view==='output'){stopOutputRecording();stopSpeechRecognition();}view=k;filterScene='';filterType='';search='';render();window.scrollTo(0,0)}
function openTag(id){

function header(k,title,lead,extra=''){return `<div class="top"><div><div class="eyebrow">${k}</div><h1 class="title">${title}</h1><p class="lead">${lead}</p></div>${extra}</div>`}

function renderHome(){const pending=db.items.filter(reviewDue).length,unused=db.items.filter(isNew).length;return header('MY SPEAKING SPACE','把学过的表达，变成能说出口的话。','从口语课上收集，到生活中自然说出来。',`<button class="primary" data-action="newItem">＋ 添加表达</button>`)+`<div class="grid3"><div class="card stat"><label>已收录表达</label><strong>${db.items.length}</strong><small>我的口语素材</small></div><div class="card stat"><label>待学新内容</label><strong>${unused}</strong><small>还没开始学习</small></div><div class="card stat"><label>今日待复习</label><strong>${pending}</strong><small>到期的旧表达</small></div></div><div class="sectionhead"><h2>开始今天的练习</h2></div><div class="row"><button class="primary" data-action="startReview">复习到期内容 (${pending})</button><button data-action="startNew">学习新表达 (${unused})</button><button data-nav="output">主动输出</button></div><div class="sectionhead"><h2>生活场景</h2><button class="ghost" data-action="newScene">＋ 新建场景</button></div><div class="scenario-grid">${db.scenes.map(s=>`<button class="scenario" data-action="openScene" data-id="${escapeHTML(s.id)}"><div class="scene-icon">${sceneIcon(s)}</div><div class="line"><b>${escapeHTML(s.name)}</b><small>${countScene(s.id)} 条</small></div></button>`).join('')}</div><div class="sectionhead"><h2>整理建议</h2></div><div class="notice">先按生活场景整理，再区分句子 / 短语 / 固定搭配 / 单词；每条表达都可写备注。复习时先尝试回忆，再查看中文和笔记。</div>`}

function start(type){mode=type;study=db.items.filter(type==='new'?isNew:reviewDue).sort((a,b)=>type==='new'?a.createdAt.localeCompare(b.createdAt):(a.nextReview||'').localeCompare(b.nextReview||''));studyIndex=0;sessionSummary=[];showAnswer=false;if(!study.length){toast(type==='new'?'没有待学新表达':'今天没有到期复习');return}studyPage()}
function studyPage(){const i=study[studyIndex];if(!i){finish();return}view='session';document.getElementById('sideNav').innerHTML=navHTML();document.getElementById('bottomNav').innerHTML=navHTML(true);document.getElementById('content').innerHTML=header(mode==='new'?'NEW EXPRESSIONS':'REVIEW SESSION',mode==='new'?'学习新表达':'复习旧表达',`第 ${studyIndex+1} / ${study.length} 条`,`<button data-action="endSession">结束练习</button>`)+`<div class="studycard"><div class="progress"><div style="width:${(studyIndex/study.length)*100}%"></div></div><div class="card" style="margin-top:14px;padding:25px"><div class="row" style="justify-content:space-between"><div class="mini">${escapeHTML(getScene(i.sceneId)?.name||'未分类')} · ${escapeHTML(i.type)}</div><button data-action="speak" data-id="${escapeHTML(i.id)}">▶ 朗读</button></div><div class="study-en">${escapeHTML(i.en)}</div>${!showAnswer?`<p class="note">先试着说出这句话的中文意思，并想想会在什么场景里用到。</p><button class="primary" data-action="showAnswer" style="width:100%;margin-top:16px">显示答案与笔记</button>`:`<div class="study-zh">${escapeHTML(i.zh||'（没有填写中文释义）')}</div>${i.note?`<div class="study-note"><b>表达笔记</b><p style="white-space:pre-wrap">${escapeHTML(i.note)}</p></div>`:''}<p class="mini">这次你记得怎么样？</p><div class="choice"><button data-action="grade" data-grade="again" style="background:#fbeae6;color:#a4544e">忘记了</button><button data-action="grade" data-grade="hard" style="background:#fcf0dd;color:#93713b">有点模糊</button><button data-action="grade" data-grade="good" style="background:#e3f2eb;color:#33735e">记住了</button></div>`}</div></div>`}
function grade(g){const i=study[studyIndex];if(!i)return;const wasNew=isNew(i);const prev=Number(i.interval)||0;let days;if(g==='again'){days=1;i.streak=0}else if(g==='hard'){days=wasNew?1:Math.max(1,Math.ceil(prev*1.5));i.streak=Math.max(0,Number(i.streak)||0)}else{days=wasNew?2:Math.min(180,Math.max(2,Math.ceil(prev*2.2)));i.streak=(Number(i.streak)||0)+1}const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);i.lastStudied=today();i.nextReview=d.toLocaleDateString('en-CA');i.interval=days;sessionSummary.push({en:i.en,grade:g,days,next:i.nextReview});save();studyIndex++;showAnswer=false;studyPage()}

function quoteTSV(s){return String(s??'').replace(/[\t\r\n]+/g,' ').trim()};function download(name,body,type='text/plain;charset=utf-8'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function parseDelimited(text){text=text.replace(/^\uFEFF/,'').trim();if(!text)return[];const delim=text.split(/\r?\n/)[0].includes('\t')?'\t':',';let result=[],row=[],cell='',q=false;for(let x=0;x<text.length;x++){const c=text[x];if(c==='"'){if(q&&text[x+1]==='"'){cell+='"';x++}else q=!q}else if(c===delim&&!q){row.push(cell);cell=''}else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&text[x+1]==='\n')x++;row.push(cell);if(row.some(v=>v.trim()))result.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))result.push(row);return result}

function mergeBackup(v){

   const later=document.createElement('button');later.type='button';later.textContent='稍后再说';
   const now=document.createElement('button');now.type='button';now.className='primary';now.textContent='立即更新';
   later.onclick=()=>{shade.remove();showing=false};
   now.onclick=async()=>{
     now.disabled=true;now.textContent='检查新版…';msg.textContent='';
     try{
       const url=await getLatestHTML(version);
       // Avoid an endless reload loop if a standalone iPad app keeps an older document cached.
       const key='nova-update-attempt-'+version;
       let count=0;try{count=Number(sessionStorage.getItem(key)||'0')}catch(e){}
       if(count>=2){throw new Error('此设备仍在使用旧页面，请关闭 App 后从 Safari 打开网站一次。')}
       try{sessionStorage.setItem(key,String(count+1))}catch(e){}
       now.textContent='正在更新…';
       location.replace(url.toString()+location.hash);
     }catch(err){msg.textContent=(err&&err.message?err.message:'网络暂时不可用')+'，请稍后重试。';now.disabled=false;now.textContent='重试更新';}
   };
   actions.append(later,now);panel.append(heading,desc,msg,actions);shade.append(panel);document.body.append(shade);
 }
 async function check(force=false){
   if(checking||showing||(!force&&Date.now()-lastCheck<CHECK_INTERVAL))return;
   checking=true;lastCheck=Date.now();
   try{
     const u=new URL('./version.json',location.href);u.searchParams.set('t',String(Date.now()));
     const r=await fetch(u.toString(),{cache:'no-store'});if(!r.ok)return;
     const data=await r.json();if(!data||typeof data.version!=='string'||!versionRE.test(data.version))return;
     if(compare(data.version,CURRENT_VERSION)<=0)return;
     // Verify deployment is complete before displaying an update prompt.
     await getLatestHTML(data.version);
     dialog(data.version);
   }catch(e){/* Offline or deployment still in progress: keep using existing app. */}
   finally{checking=false;}
 }
 window.addEventListener('pageshow',()=>check(true));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(true)});
 window.addEventListener('focus',()=>check());
 window.setInterval(()=>{if(!document.hidden)check()},CHECK_INTERVAL);
 window.novaCheckForUpdates=()=>check(true);
})();
</script>
